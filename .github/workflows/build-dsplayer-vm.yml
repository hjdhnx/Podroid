name: build-dsplayer-vm

# docker-only fork: builds the raw VM artifacts (kernel + initramfs, Alpine
# rootfs squashfs, QEMU .so set), packs them into the app, then assembles a
# release APK (applicationId com.dsplayer.vm, debug-signed via the standard
# debug keystore so side-loading works out of the box).
on:
  push:
    branches: [ docker-only ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The rootfs stages run arm64 containers. Register binfmt so those
      # execute on the amd64 runner (with QEMU user-mode translation).
      - name: Set up QEMU (arm64 binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show docker info
        run: docker info

      - name: Build VM artifacts
        run: |
          chmod +x build-all.sh
          ./build-all.sh artifacts 2>&1 | tee build.log

      # VM artifacts land in app/src/main/assets + jniLibs via build-all.sh
      # (build_initramfs/build_rootfs/build_qemu write into those dirs). Show
      # what ended up there so the APK step packs the right set.
      - name: Show packed VM artifacts
        run: |
          ls -la app/src/main/assets/vmlinuz-virt app/src/main/assets/initrd.img \
                app/src/main/assets/alpine-rootfs.squashfs 2>/dev/null
          ls -la app/src/main/jniLibs/arm64-v8a/ 2>/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # app/build.gradle.kts falls back to ~/.android/debug.keystore for the
      # release signingConfig. GitHub runners don't ship one, so generate it
      # (standard debug keystore: alias androiddebugkey / password android).
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble release APK
        run: |
          # R8 + shrinkResources in release; debug keystore fallback is baked
          # into signingConfigs in app/build.gradle.kts.
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee -a build.log

      - name: Locate APK
        run: ls -la app/build/outputs/apk/release/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsplayer-vm-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7